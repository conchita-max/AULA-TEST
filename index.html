
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AULA TEST</title>
<style>
body{font-family:Arial;margin:0;background:#f1f4f8;color:#18243a}
header{background:#18365e;color:white;padding:22px;text-align:center}
main{max-width:900px;margin:auto;padding:16px}
button{padding:13px;border:0;border-radius:8px;background:#245da0;color:white;margin:5px;font-size:16px}
section{background:white;padding:16px;border-radius:10px;margin-top:16px}
iframe{width:100%;height:65vh;border:1px solid #ccc}
input{margin:12px 0}
</style>
</head>
<body>
<header>
<h1>AULA TEST</h1>
<p>Estudia · Practica · Aprende</p>
</header>
<main>
<button onclick="ver('temario')">📖 Estudiar temario</button>
<button onclick="ver('test')">✍️ Hacer test</button>

<section id="temario">
<h2>Reglamento de Armas</h2>
<p>Real Decreto 137/1993, de 29 de enero.</p>
<p><a href="https://www.boe.es/buscar/pdf/1993/BOE-A-1993-6202-consolidado.pdf" target="_blank">Abrir Reglamento oficial en el BOE</a></p>
<iframe src="https://www.boe.es/buscar/pdf/1993/BOE-A-1993-6202-consolidado.pdf"></iframe>
<h3>Cargar otro temario PDF</h3>
<input type="file" accept=".pdf,application/pdf" onchange="cargar(event)">
<iframe id="documento" style="display:none"></iframe>
</section>

<section id="test" style="display:none">
<h2>Zona de test</h2>
<p>Primer ejemplo de pregunta:</p>
<p><b>¿Qué norma aprueba el Reglamento de Armas?</b></p>
<div id="respuestas">
<button onclick="corregir(0)">Real Decreto 137/1993</button>
<button onclick="corregir(1)">Ley Orgánica 2/1986</button>
<button onclick="corregir(2)">Real Decreto 818/2009</button>
</div>
<p id="resultado"></p>
</section>
</main>
<script>
function ver(id){
document.getElementById('temario').style.display=id==='temario'?'block':'none';
document.getElementById('test').style.display=id==='test'?'block':'none';
}
function cargar(e){
let f=e.target.files[0];
if(!f)return;
let url=URL.createObjectURL(f);
let d=document.getElementById('documento');
d.src=url;
d.style.display='block';
}
function corregir(n){
document.getElementById('resultado').textContent=
n===0?'¡Correcto!':'Incorrecto. La respuesta correcta es el Real Decreto 137/1993.';
}
</script>
</body>
</html>
